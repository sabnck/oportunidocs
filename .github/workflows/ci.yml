name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-build:
    name: Desktop build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: app-desktop
        run: npm ci

      - name: Lint desktop app
        working-directory: app-desktop
        run: npm run lint

      - name: Build desktop app
        working-directory: app-desktop
        run: npm run build

      - name: Check standalone API syntax
        working-directory: core-api
        run: node --check src/server.js
